# Konfigurasi Netlify untuk monorepo SIFA (npm workspaces)
# Aplikasi Next.js berada di apps/web

[build]
  # Build hisab-core (tsc) lebih dulu, lalu build app Next.js
  command = "npm run build --workspace=packages/hisab-core && npm run build --workspace=apps/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

# Plugin resmi Netlify untuk Next.js (SSR, image optimization, dll.)
[[plugins]]
  package = "@netlify/plugin-nextjs"

